
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google-site-verification" content="ltRxPhYFLTv9TU3ppETUiOM_r3WyA0SaPImp-NQsYnU" />

  <meta name="description" content="Meet Orbinex AI, your friendly AI assistant. Ask questions, explore ideas, learn, and chat.">
  <meta name="theme-color" content="#10111b">

  <title>Orbinex AI - Your AI Assistant</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111b;
      color: white;
      display: flex;
      min-height: 100vh;
    }

    aside {
      width: 240px;
      background: #171925;
      padding: 20px;
      border-right: 1px solid #292c3b;
    }

    aside h2 { color: #8b9cff; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      background: #6578f5;
      color: white;
      font-size: 15px;
    }

    aside button { width: 100%; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #292c3b;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
    }

    .message {
      max-width: 750px;
      padding: 14px 17px;
      margin: 12px 0;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #303b78;
      margin-left: auto;
    }

    .bot { background: #202333; }

    #welcome {
      text-align: center;
      margin-top: 15vh;
      color: #c5c9dc;
    }

    #welcome h1 { color: #8b9cff; }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-top: 1px solid #292c3b;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #35394d;
      background: #202333;
      color: white;
      font-size: 16px;
    }

    #status {
      color: #aab0c9;
      font-size: 13px;
      padding: 0 18px 10px;
    }

    @media (max-width: 650px) {
      aside {
        width: 125px;
        padding: 10px;
      }

      aside h2 { font-size: 17px; }
      #chat { padding: 12px; }
    }
  </style>
</head>

<body>

  <aside>
    <h2>Orbinex AI</h2>
    <button onclick="newChat()">+ New Chat</button>
    <p style="color:#9da3bb;font-size:13px;">Your AI assistant</p>
  </aside>

  <main>
    <header>Orbinex AI</header>

    <div id="chat">
      <div id="welcome">
        <h1>Welcome to Orbinex AI</h1>
        <p>Ask me anything. Let's get started!</p>
      </div>
    </div>

    <div id="status">Ready</div>

    <div id="input-area">
      <input
        id="message"
        type="text"
        placeholder="Message Orbinex AI..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >
      <button onclick="sendMessage()">Send</button>
    </div>
  </main>

<script>
const API_URL =
  "https://old-leaf-f8d3.zmbiehnter32255.workers.dev";

let history = [];

function addMessage(text, sender) {
  document.getElementById("welcome")?.remove();

  const chat = document.getElementById("chat");
  const div = document.createElement("div");

  div.className = "message " + sender;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function newChat() {
  history = [];

  document.getElementById("chat").innerHTML = `
    <div id="welcome">
      <h1>Welcome to Orbinex AI</h1>
      <p>Ask me anything. Let's get started!</p>
    </div>`;

  document.getElementById("status").textContent = "New chat";
}

async function sendMessage() {
  const input = document.getElementById("message");
  const message = input.value.trim();

  if (!message) return;

  input.value = "";
  addMessage(message, "user");

  document.getElementById("status").textContent =
    "Orbinex is thinking...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        history: history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    const reply =
      data.reply || "I couldn't generate a response.";

    addMessage(reply, "bot");

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: reply }
    );

    history = history.slice(-12);

    document.getElementById("status").textContent =
      "Connected";

  } catch (error) {
    addMessage(
      "Connection error: " + error.message,
      "bot"
    );

    document.getElementById("status").textContent =
      "Connection problem";
  }
}
</script>

</body>
</html>
